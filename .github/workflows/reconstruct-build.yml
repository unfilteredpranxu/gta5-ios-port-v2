name: Reconstruct and Build V2 IPA

on:
  workflow_dispatch:
    inputs:
      paid_account:
        description: "Use the extra-memory entitlement configuration"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Refuse public repository
        run: |
          test "${{ github.event.repository.private }}" = "true" || {
            echo "::error::This workflow must run in a private repository."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Reconstruct migration archive from uploaded parts
        run: |
          set -euo pipefail
          for f in gta5-v2-package.part00 gta5-v2-package.part01 gta5-v2-package.part02; do
            test -s "$f" || { echo "::error::Missing or empty upload part: $f"; exit 1; }
          done
          cat gta5-v2-package.part00 gta5-v2-package.part01 gta5-v2-package.part02 > "$RUNNER_TEMP/candidate.zip"
          unzip -tq "$RUNNER_TEMP/candidate.zip"
          mkdir -p "$RUNNER_TEMP/package"
          unzip -oq "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/package"
          src="$(find "$RUNNER_TEMP/package" -maxdepth 5 -type f -name build_ipa.sh -print -quit | xargs dirname)"
          test -n "$src" || { echo "::error::Could not locate build_ipa.sh in reconstructed archive."; exit 1; }
          echo "SOURCE_DIR=$src" >> "$GITHUB_ENV"
          echo "Reconstructed and validated archive."

      - name: Apply pinned-tool compatibility adjustment
        run: |
          python3 - "$SOURCE_DIR/app/Scripts/prepare.py" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          old = "'--enable-threads', '--enable-memory64', '--no-debug-names'"
          new = "'--enable-threads', '--no-debug-names'"
          if old in source:
              p.write_text(source.replace(old, new, 1))
              print("Removed wasm2c CLI switch unsupported by the pinned tool build.")
          elif new in source:
              print("wasm2c CLI argument sequence already compatible.")
          else:
              raise SystemExit("Could not identify the expected wasm2c argument sequence; refusing an unsafe patch.")
          PY

      - name: Make the optional Scaleform workaround tolerant of V2 body changes
        run: |
          python3 - "$SOURCE_DIR/app/Scripts/prepare_missing_scaleform.py" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          old = "raise RuntimeError(f'Pinned f{REQUEST} (CommandRequestScaleformMovieCommon) changed')"
          replacement = "print(f'WARNING: V2 Scaleform body differs in {path.name}; skipping optional workaround.'); raise SystemExit(0)"
          missing = "if not done: raise RuntimeError(f'Pinned function f{REQUEST} not found')"
          missing_replacement = "if not done: print('WARNING: V2 Scaleform function not found; skipping optional workaround.'); raise SystemExit(0)"
          changed = False
          if replacement not in source:
              if old not in source:
                  raise SystemExit("Scaleform guard text did not match expected source; refusing an unsafe edit.")
              source = source.replace(old, replacement, 1)
              changed = True
          if missing_replacement not in source:
              if missing not in source:
                  raise SystemExit("Scaleform function guard text did not match expected source; refusing an unsafe edit.")
              source = source.replace(missing, missing_replacement, 1)
              changed = True
          if changed:
              p.write_text(source)
              print("Patched optional Scaleform fallback to skip only when V2's generated C is incompatible.")
          else:
              print("Scaleform compatibility adjustment already present.")
          compile(source, str(p), "exec")
          PY

      - name: Validate V2 inputs and scripts
        run: |
          bash "$SOURCE_DIR/check_v2_inputs.sh"

      - name: Assemble bundled V2 engine and shader packs
        run: |
          mkdir -p "$RUNNER_TEMP/game-files/b/8b0b5899ed/shaders"
          unzip -oq "$SOURCE_DIR/build-inputs/v2-core-files.zip" -d "$RUNNER_TEMP/game-files"
          unzip -oq "$SOURCE_DIR/build-inputs/v2-shader-packs.zip" -d "$RUNNER_TEMP/game-files/b/8b0b5899ed/shaders"
          python3 "$SOURCE_DIR/app/Scripts/check_game_files.py" --mirror "$RUNNER_TEMP/game-files"

      - name: Install build tools
        run: brew install xcodegen

      - name: Ensure Metal toolchain is installed
        run: xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned IPA
        env:
          JOBS: "2"
        run: |
          set -euo pipefail
          if [ "${{ inputs.paid_account }}" = "true" ]; then
            "$SOURCE_DIR/build_ipa.sh" --mirror "$RUNNER_TEMP/game-files"
          else
            "$SOURCE_DIR/build_ipa.sh" --mirror "$RUNNER_TEMP/game-files" --free
          fi

      - name: Stage IPA in workspace
        if: success()
        run: cp "$SOURCE_DIR/GTA5Port.ipa" "$GITHUB_WORKSPACE/GTA5Port.ipa"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          if [ -n "${SOURCE_DIR:-}" ]; then
            for name in input-check.log prepare.log xcodebuild.log import-status.tsv; do
              if [ -f "$SOURCE_DIR/app/Build/$name" ]; then
                cp "$SOURCE_DIR/app/Build/$name" "$GITHUB_WORKSPACE/diagnostics/$name"
              fi
            done
            if [ -f "$SOURCE_DIR/app/Generated/funcnames.tsv" ]; then
              cp "$SOURCE_DIR/app/Generated/funcnames.tsv" "$GITHUB_WORKSPACE/diagnostics/funcnames.tsv"
            fi
          fi
          if [ -f "$RUNNER_TEMP/candidate.zip" ]; then
            unzip -tq "$RUNNER_TEMP/candidate.zip" > "$GITHUB_WORKSPACE/diagnostics/archive-integrity.txt" 2>&1
            echo "archive-integrity-exit=$?" >> "$GITHUB_WORKSPACE/diagnostics/archive-integrity.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GTA5Port-ipa
          path: GTA5Port.ipa
          retention-days: 3

      - name: Publish private release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-ipa --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-ipa GTA5Port.ipa --repo "${{ github.repository }}" --title "V2 iOS diagnostic build $(date -u +%Y-%m-%d)" --notes "Unsigned diagnostic IPA. A successful build does not establish runtime compatibility; test on a compatible iPad."
